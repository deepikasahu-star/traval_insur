<section class="quote-wrap">
  <a class="outline-btn" href="index.html">‹ Back</a><br><br>
  <h2>Let's Find The Right Plan For You</h2>

  <label>Main Destination</label>
  <input id="destination" value="India" />

  <label>Travel Dates</label>
  <div class="grid-2">
    <input id="departDate" type="date" value="2026-05-15" />
    <input id="returnDate" type="date" value="2026-05-30" />
  </div>

  <div class="small-grid">
    <div>
      <label>How many travelers?</label>
      <select id="travelers"><option>1</option><option>2</option><option>3</option></select>
    </div>
    <div>
      <label>Age</label>
      <input id="age" value="30" />
    </div>
  </div>

  <label>Citizenship:</label>
  <input value="✅ United States" />

  <div class="grid-2">
    <div><label>Country of legal residence:</label><input value="✅ United States" /></div>
    <div><label>State of legal residence:</label><input id="state" value="IN" /></div>
  </div>

  <label>Do you want to cover the cost of your trip?</label>
  <div><input type="checkbox" checked style="width:auto"> Yes, cover my trip cost</div>

  <div class="grid-2">
    <div><label>Total Trip Cost</label><input id="tripCost" value="$200" /></div>
    <div><label>First Deposit Date</label><input id="firstDepositDate" type="date" value="2026-05-15" /></div>
  </div>

  <button class="disabled-btn" onclick="saveQuoteAndGo()">SEE PLANS & PRICES</button>
</section>

<script src="script.js"></script>
</body>
